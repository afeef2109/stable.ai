kind = "web"
previewPath = "/"
title = "STABLE — Enterprise AI Reliability"
version = "1.0.0"
id = "artifacts/stable"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18634

[services.development]
run = "pnpm --filter @workspace/stable run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/stable", "run", "build" ]
publicDir = "artifacts/stable/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18634"
BASE_PATH = "/"
